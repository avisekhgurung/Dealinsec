<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <!-- Status-bar tint follows the app theme; the bootstrap below rewrites
         these to the ACTIVE theme so an explicit Light/Dark choice wins over
         the OS preference (which is all the media queries can see). -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DealInSec" />
    <meta name="application-name" content="DealInSec" />
    <meta name="description" content="For India's freelancers: quotation, e-signed agreement, invoice and payment tracking on one thread per client. Free plan, 7-day Pro trial, Pro ₹99/month." />
    <meta property="og:title" content="Quotation, Agreement &amp; Invoice App for Freelancers | DealInSec" />
    <meta property="og:description" content="One thread per client — quotation, e-signed agreement, invoice and payment tracking. Put the scope in writing before you start, and invoice the day the work is done." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DealInSec" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DealInSec — Quotation, Agreement &amp; Invoice App for Freelancers" />
    <meta name="twitter:description" content="Built for India's freelancers — designers, developers, writers, video editors &amp; photographers, marketers and consultants. Free plan, 7-day Pro trial, Pro ₹99/month." />
    <link rel="canonical" href="https://www.dealinsec.com/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Quotation, Agreement &amp; Invoice App for Freelancers | DealInSec</title>

    <!-- Structured data (helps Google understand + show the site) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "DealInSec",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Software for India's freelancers — designers, developers, writers, video editors and photographers, marketers and consultants: quotations, e-signed agreements, invoices and payment tracking on one thread per client.",
        "url": "https://www.dealinsec.com/",
        "offers": [
          { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "INR" },
          { "@type": "Offer", "name": "Pro Monthly", "price": "99", "priceCurrency": "INR" },
          { "@type": "Offer", "name": "Pro Annual", "price": "999", "priceCurrency": "INR" }
        ],
        "publisher": { "@type": "Organization", "name": "DealInSec", "url": "https://www.dealinsec.com/" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DealInSec",
        "url": "https://www.dealinsec.com/",
        "logo": "https://www.dealinsec.com/apple-touch-icon.png",
        "description": "Quotation, agreement, invoice and payment-tracking software for India's freelancers — designers, developers, writers, video editors and photographers, marketers and consultants."
      }
    </script>
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "WebSite", "name": "DealInSec", "url": "https://www.dealinsec.com/" }
    </script>

    <!-- Google Analytics (GA4) -->
    <!-- SPA route changes are tracked from the React side (see lib/analytics.ts),
         so we disable the automatic first-load page_view to avoid double-counting. -->
    <!-- Analytics loads ONLY on the real domain: localhost dev sessions and
         automated browser tests were polluting GA with page_views and even
         create_deal events, which corrupts every conversion number. On other
         hosts gtag stays undefined and lib/analytics.ts no-ops safely. -->
    <script>
      (function () {
        var h = location.hostname;
        if (h === "localhost" || h === "127.0.0.1" || h.endsWith(".local")) return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-W3VTLRH79B";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", "G-W3VTLRH79B", { send_page_view: false });
      })();
    </script>
    <!-- Pre-paint bootstraps: sidebar collapse + theme, applied before first
         style resolution so neither ever flashes. Theme default is LIGHT —
         "system" only applies when the user chose it in Settings. -->
    <script>
      try {
        if (localStorage.getItem('dis_sidebar_collapsed') === '1')
          document.documentElement.setAttribute('data-sidebar', 'collapsed');
        var t = localStorage.getItem('dis_theme');
        if (t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
        // Collapse the two media-scoped tags into one that matches the theme
        // the app actually rendered (an explicit choice can differ from the OS).
        var applied = document.documentElement.classList.contains('dark');
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].parentNode.removeChild(metas[i]);
        var m = document.createElement('meta');
        m.name = 'theme-color';
        m.content = applied ? '#0B1220' : '#FFFFFF';
        document.head.appendChild(m);
        var s2 = document.createElement('meta');
        s2.name = 'apple-mobile-web-app-status-bar-style';
        s2.content = applied ? 'black-translucent' : 'default';
        document.head.appendChild(s2);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
