<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <!-- Status-bar tint follows the app theme; the bootstrap below rewrites
         these to the ACTIVE theme so an explicit Light/Dark choice wins over
         the OS preference (which is all the media queries can see). -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DealInSec" />
    <meta name="application-name" content="DealInSec" />
    <meta name="description" content="A simple workspace for Indian freelancers: find clients, track deals, send quotations and agreements, create invoices and follow up on payments. Free plan; Pro ₹199/month." />
    <meta property="og:title" content="DealInSec: Find Clients, Win Deals, Get Paid" />
    <meta property="og:description" content="A simple business workspace for Indian freelancers and service providers: find clients with AI coworkers, manage deals, send quotations and agreements, create invoices and follow up on payments." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DealInSec" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DealInSec: Find Clients, Win Deals, Get Paid" />
    <meta name="twitter:description" content="A simple business workspace for Indian freelancers and service providers: find clients with AI coworkers, manage deals, send quotations and agreements, create invoices and follow up on payments." />
    <link rel="canonical" href="https://www.dealinsec.com/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&text=From%20prospect%20to%20payment&display=swap" rel="stylesheet">
    <!-- The homepage title. Other public SPA pages replace it with their own (server/site-head.ts). -->
    <title>DealInSec: Find Clients, Win Deals, Get Paid</title>

    <!-- Structured data (SoftwareApplication, Organization, WebSite) is added to the homepage by the server
         (server/site-head.ts), generated from shared/product-facts.ts so it can't drift from the product. -->

    <!-- Google Analytics (GA4) -->
    <!-- SPA route changes are tracked from the React side (see lib/analytics.ts),
         so we disable the automatic first-load page_view to avoid double-counting. -->
    <!-- Analytics consent (option a): Google Analytics is NOT loaded until the visitor accepts, and never on
         localhost. Generated from shared/consent-script.ts consentScript("spa"); server/seo.test.ts fails if this
         copy differs. Page views are sent by React (lib/analytics.ts); the banner is components/cookie-banner.tsx. -->
    <script>(function(){var ID='G-W3VTLRH79B',KEY='dis_consent',V=1,MAX=365*864e5;function read(){try{var v=JSON.parse(localStorage.getItem(KEY)||'null');if(!v||v.v!==V||(v.analytics!=='granted'&&v.analytics!=='denied'))return null;if(!(Date.now()-Date.parse(v.at)<MAX))return null;return v.analytics}catch(e){return null}}function local(){var h=location.hostname;return h==='localhost'||h==='127.0.0.1'||h==='[::1]'||/\.local$/.test(h)}function load(){if(window.__disGa||local())return;window.__disGa=true;window['ga-disable-'+ID]=false;var s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+ID;document.head.appendChild(s);window.dataLayer=window.dataLayer||[];window.gtag=function(){window.dataLayer.push(arguments)};window.gtag('js',new Date());window.gtag('config',ID,{send_page_view:false});}function wipe(){var d=location.hostname.replace(/^www\./,'');document.cookie.split(';').forEach(function(c){var n=c.split('=')[0].trim();if(!/^_ga/.test(n))return;['',';domain='+d,';domain=.'+d].forEach(function(x){document.cookie=n+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/'+x})})}window.disConsent={get:read,load:load,set:function(a){if(a!=='granted'&&a!=='denied')return;try{localStorage.setItem(KEY,JSON.stringify({v:V,analytics:a,at:new Date().toISOString()}))}catch(e){}if(a==='granted'){load()}else{window['ga-disable-'+ID]=true;wipe()}try{window.dispatchEvent(new CustomEvent('dis:consent',{detail:a}))}catch(e){}}};if(read()==='granted')load()})();</script>
    <!-- Pre-paint bootstrap: theme, applied before first style resolution so
         it never flashes. Theme default is LIGHT —
         "system" only applies when the user chose it in Settings. -->
    <script>
      try {
        var t = localStorage.getItem('dis_theme');
        if (t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
        // Collapse the two media-scoped tags into one that matches the theme
        // the app actually rendered (an explicit choice can differ from the OS).
        var applied = document.documentElement.classList.contains('dark');
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].parentNode.removeChild(metas[i]);
        var m = document.createElement('meta');
        m.name = 'theme-color';
        m.content = applied ? '#0B1220' : '#FFFFFF';
        document.head.appendChild(m);
        var s2 = document.createElement('meta');
        s2.name = 'apple-mobile-web-app-status-bar-style';
        s2.content = applied ? 'black-translucent' : 'default';
        document.head.appendChild(s2);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
