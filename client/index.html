<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <!-- Status-bar tint follows the app theme; the bootstrap below rewrites
         these to the ACTIVE theme so an explicit Light/Dark choice wins over
         the OS preference (which is all the media queries can see). -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DealInSec" />
    <meta name="application-name" content="DealInSec" />
    <meta name="description" content="Manage freelance deals from quote to agreement to invoice. Keep client work organized, protect your scope and track payments in one simple workspace." />
    <meta property="og:title" content="DealInSec — From Freelance Deal to Paid" />
    <meta property="og:description" content="Create professional quotes, agreements and invoices, then track every client deal from one simple workspace. Built for freelancers worldwide." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DealInSec" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DealInSec — From Freelance Deal to Paid" />
    <meta name="twitter:description" content="Quotes, agreements, invoices and payment tracking for freelancers worldwide. Free plan, 7-day Pro trial, 50 currencies." />
    <link rel="canonical" href="https://www.dealinsec.com/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Homepage title carries no "| DealInSec" suffix: the brand is already in it, and Google
         also reads the site name from og:site_name and the WebSite schema below. -->
    <title>DealInSec — From Freelance Deal to Paid</title>

    <!-- Structured data (helps Google understand + show the site) -->
    <!-- Only INR offers are listed, and the paid ones carry eligibleRegion IN:
         Razorpay International is still pending, so ₹99/month and ₹999/year are
         the only prices that can actually be charged today. The international
         list prices ($99 / £79 / €89 a year, annual only) are described on the
         page as opening soon and must NOT appear here as buyable Offers. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "DealInSec",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Quotation, agreement, invoice and payment-tracking software for freelancers worldwide — designers, developers, writers, video editors and photographers, marketers and consultants. Every client project stays on one thread: quotation, e-signed agreement, invoice, payment tracking. 50 currencies, with the tax field, bank labels and invoice numbering each country uses — including GSTIN, PAN and GST-ready invoices for freelancers in India.",
        "url": "https://www.dealinsec.com/",
        "offers": [
          { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "INR", "description": "4 deals a month, each with its quotation. Available in every country." },
          { "@type": "Offer", "name": "Pro Monthly", "price": "99", "priceCurrency": "INR", "eligibleRegion": { "@type": "Country", "name": "India" } },
          { "@type": "Offer", "name": "Pro Annual", "price": "999", "priceCurrency": "INR", "eligibleRegion": { "@type": "Country", "name": "India" } }
        ],
        "publisher": { "@type": "Organization", "name": "DealInSec", "url": "https://www.dealinsec.com/" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DealInSec",
        "url": "https://www.dealinsec.com/",
        "logo": "https://www.dealinsec.com/apple-touch-icon.png",
        "description": "Quotation, agreement, invoice and payment-tracking software for freelancers worldwide — designers, developers, writers, video editors and photographers, marketers and consultants. India is one of the markets it serves closely, with GSTIN and PAN fields and free GST tools."
      }
    </script>
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "WebSite", "name": "DealInSec", "url": "https://www.dealinsec.com/" }
    </script>

    <!-- Google Analytics (GA4) -->
    <!-- SPA route changes are tracked from the React side (see lib/analytics.ts),
         so we disable the automatic first-load page_view to avoid double-counting. -->
    <!-- Analytics loads ONLY on the real domain: localhost dev sessions and
         automated browser tests were polluting GA with page_views and even
         create_deal events, which corrupts every conversion number. On other
         hosts gtag stays undefined and lib/analytics.ts no-ops safely. -->
    <script>
      (function () {
        var h = location.hostname;
        if (h === "localhost" || h === "127.0.0.1" || h.endsWith(".local")) return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-W3VTLRH79B";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", "G-W3VTLRH79B", { send_page_view: false });
      })();
    </script>
    <!-- Pre-paint bootstrap: theme, applied before first style resolution so
         it never flashes. Theme default is LIGHT —
         "system" only applies when the user chose it in Settings. -->
    <script>
      try {
        var t = localStorage.getItem('dis_theme');
        if (t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
        // Collapse the two media-scoped tags into one that matches the theme
        // the app actually rendered (an explicit choice can differ from the OS).
        var applied = document.documentElement.classList.contains('dark');
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].parentNode.removeChild(metas[i]);
        var m = document.createElement('meta');
        m.name = 'theme-color';
        m.content = applied ? '#0B1220' : '#FFFFFF';
        document.head.appendChild(m);
        var s2 = document.createElement('meta');
        s2.name = 'apple-mobile-web-app-status-bar-style';
        s2.content = applied ? 'black-translucent' : 'default';
        document.head.appendChild(s2);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
