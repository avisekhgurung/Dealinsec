<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <!-- Status-bar tint follows the app theme; the bootstrap below rewrites
         these to the ACTIVE theme so an explicit Light/Dark choice wins over
         the OS preference (which is all the media queries can see). -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DealInSec" />
    <meta name="application-name" content="DealInSec" />
    <meta name="description" content="Make quotations, e-signed agreements and invoices for every client deal, and track who owes you. Built for India's interior designers, architects, real estate consultants, agencies and contractors. Free 7-day trial, no card. Free GST invoice tool with no sign-up." />
    <meta property="og:title" content="Quotation, Agreement &amp; Invoice Software for Indian Businesses | DealInSec" />
    <meta property="og:description" content="One thread per client deal — quotation, e-signed agreement, invoice and payment tracking. Look professional, never chase a client, get paid on time." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DealInSec" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DealInSec — Deal, Agreement & Invoice Software for Real Estate, Interiors, Architects & Agencies" />
    <meta name="twitter:description" content="Quotations, e-signed agreements, invoices and payment tracking for India's interior design, architecture, real estate, agency and construction businesses." />
    <link rel="canonical" href="https://www.dealinsec.com/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Quotation, Agreement &amp; Invoice Software for Indian Businesses | DealInSec</title>

    <!-- Structured data (helps Google understand + show the site) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "DealInSec",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Deal-management software for India's real estate consultants, interior designers, architects, agencies and contractors: quotations, e-signed agreements, invoices and payment tracking in one workflow.",
        "url": "https://www.dealinsec.com/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
        "publisher": { "@type": "Organization", "name": "DealInSec", "url": "https://www.dealinsec.com/" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DealInSec",
        "url": "https://www.dealinsec.com/",
        "logo": "https://www.dealinsec.com/apple-touch-icon.png",
        "description": "The deal-management OS for India's service sectors — real estate, interiors, architecture, agencies and construction. Quotations, e-signed agreements, invoices and payment tracking in one place."
      }
    </script>
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "WebSite", "name": "DealInSec", "url": "https://www.dealinsec.com/" }
    </script>

    <!-- Google Analytics (GA4) -->
    <!-- SPA route changes are tracked from the React side (see lib/analytics.ts),
         so we disable the automatic first-load page_view to avoid double-counting. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W3VTLRH79B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-W3VTLRH79B', { send_page_view: false });
    </script>
    <!-- Pre-paint bootstraps: sidebar collapse + theme, applied before first
         style resolution so neither ever flashes. Theme default is LIGHT —
         "system" only applies when the user chose it in Settings. -->
    <script>
      try {
        if (localStorage.getItem('dis_sidebar_collapsed') === '1')
          document.documentElement.setAttribute('data-sidebar', 'collapsed');
        var t = localStorage.getItem('dis_theme');
        if (t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
        // Collapse the two media-scoped tags into one that matches the theme
        // the app actually rendered (an explicit choice can differ from the OS).
        var applied = document.documentElement.classList.contains('dark');
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].parentNode.removeChild(metas[i]);
        var m = document.createElement('meta');
        m.name = 'theme-color';
        m.content = applied ? '#0B1220' : '#FFFFFF';
        document.head.appendChild(m);
        var s2 = document.createElement('meta');
        s2.name = 'apple-mobile-web-app-status-bar-style';
        s2.content = applied ? 'black-translucent' : 'default';
        document.head.appendChild(s2);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
