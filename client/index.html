    <!-- Google Analytics (GA4) -->
    <!-- SPA route changes are tracked from the React side (see lib/analytics.ts),
         so we disable the automatic first-load page_view to avoid double-counting. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W3VTLRH79B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-W3VTLRH79B', { send_page_view: false });
    </script>
    <!-- Sidebar collapse bootstrap: runs before first style resolution so a
         collapsed sidebar never flashes at full width (and no transition
         fires on load because the attribute predates the element). -->
    <script>
      try {
        if (localStorage.getItem('dis_sidebar_collapsed') === '1')
          document.documentElement.setAttribute('data-sidebar', 'collapsed');
      } catch (e) {}
    </script>
