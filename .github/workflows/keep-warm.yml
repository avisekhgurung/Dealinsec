name: Keep warm

# Render's free tier spins the web service down after ~15 min idle; the next
# request then eats a ~50s cold start (the "service waking up" screen). This
# workflow keeps the instance awake.
#
# GitHub's scheduled runs are best-effort and can be delayed, so a single ping
# every 10 min wasn't enough — an occasional >15 min gap still let it sleep.
# Two changes make cold starts rare:
#   1) attempt every 5 minutes, and
#   2) each run pings repeatedly for ~5 min (every ~55s), pushing the "last
#      ping" time forward so the next (possibly delayed) run has a bigger buffer
#      before the 15-min idle timeout.
#
# For a hard guarantee, also point a free external pinger (cron-job.org or
# UptimeRobot) at https://www.dealinsec.com/healthz every 2-5 min — GitHub's
# timer alone can't promise sub-15-min spacing.

on:
  schedule:
    - cron: "*/5 * * * *" # attempt every 5 minutes
  workflow_dispatch: {} # manual run from the Actions tab

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /healthz repeatedly (keeps the instance awake)
        run: |
          URL="https://www.dealinsec.com/healthz"
          for i in $(seq 1 6); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors \
              "$URL" || echo "000")
            echo "$(date -u +%H:%M:%S) ping $i -> $code"
            if [ "$i" -lt 6 ]; then sleep 55; fi
          done
